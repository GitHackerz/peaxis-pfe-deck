<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">PEAXIS physical and logical architecture</title>
  <desc id="description">A presentation-ready architecture diagram showing PEAXIS deployment topology and application logic.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#F4FAFA"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#13BDB7"/>
      <stop offset="1" stop-color="#078A98"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102B54"/>
      <stop offset="1" stop-color="#061B3B"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8866E8"/>
      <stop offset="1" stop-color="#6040C2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#0D2442" flood-opacity=".10"/>
    </filter>
    <filter id="shadowSmall" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0D2442" flood-opacity=".12"/>
    </filter>
    <marker id="arrowNavy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#173D68"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0BAAA9"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7355D5"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, Arial, sans-serif; fill: #0B2545; letter-spacing: -.8px; }
      .subtitle { font: 500 17px Inter, Arial, sans-serif; fill: #5C718B; }
      .panel-title { font: 700 25px Inter, Arial, sans-serif; fill: #102B54; }
      .panel-subtitle { font: 600 13px Inter, Arial, sans-serif; fill: #70839A; letter-spacing: 1.4px; }
      .zone { font: 700 12px Inter, Arial, sans-serif; fill: #70839A; letter-spacing: 1.25px; }
      .card-title { font: 700 16px Inter, Arial, sans-serif; fill: #102B54; }
      .card-copy { font: 500 12px Inter, Arial, sans-serif; fill: #64748B; }
      .tiny { font: 600 11px Inter, Arial, sans-serif; fill: #52687F; }
      .micro { font: 700 10px Inter, Arial, sans-serif; fill: #77899D; letter-spacing: .65px; }
      .logo-label { font: 800 14px Inter, Arial, sans-serif; fill: white; text-anchor: middle; dominant-baseline: middle; }
      .logo-small { font: 800 11px Inter, Arial, sans-serif; fill: white; text-anchor: middle; dominant-baseline: middle; }
      .pill { font: 700 11px Inter, Arial, sans-serif; letter-spacing: .4px; }
      .connector { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1820" cy="64" r="250" fill="#D7F8F5" opacity=".45"/>
  <circle cx="30" cy="1030" r="300" fill="#E0E9FF" opacity=".45"/>

  <!-- Header -->
  <image x="70" y="52" width="220" height="39" xlink:href="peaxis-logo.png" preserveAspectRatio="xMinYMid meet"/>
  <rect x="70" y="122" width="54" height="5" rx="2.5" fill="#11B8B4"/>
  <text x="70" y="177" class="title">Platform architecture</text>
  <text x="70" y="208" class="subtitle">A deployment view and an implementation-backed logical flow for PEAXIS AI hiring.</text>
  <rect x="1590" y="63" width="260" height="48" rx="24" fill="#EAF8F7" stroke="#B9EAE7"/>
  <circle cx="1620" cy="87" r="9" fill="#0DB5B1"/>
  <text x="1640" y="92" class="tiny" fill="#087D88">CURRENT IMPLEMENTATION</text>

  <!-- Divider -->
  <line x1="960" y1="255" x2="960" y2="1000" stroke="#D7E2EF" stroke-width="2"/>

  <!-- LEFT: Physical architecture -->
  <text x="70" y="280" class="panel-subtitle">01 / DEPLOYMENT VIEW</text>
  <text x="70" y="315" class="panel-title">Physical architecture</text>
  <text x="70" y="340" class="subtitle">Public web clients, isolated application services, state, and model providers.</text>

  <!-- Public client -->
  <text x="88" y="392" class="zone">PUBLIC WEB</text>
  <g filter="url(#shadow)">
    <rect x="70" y="410" width="195" height="184" rx="20" fill="#FFFFFF" stroke="#D6E1ED"/>
  </g>
  <rect x="92" y="433" width="48" height="48" rx="15" fill="url(#navy)"/>
  <path d="M105 451h22v12h-22zm3 16h16v3h-16z" fill="#FFF"/>
  <text x="151" y="453" class="card-title">Web apps</text>
  <text x="151" y="474" class="card-copy">Jobs · Hire · Core · Admin</text>
  <line x1="92" y1="504" x2="243" y2="504" stroke="#E6EDF5"/>
  <text x="92" y="531" class="micro">PUBLIC SURFACE</text>
  <text x="92" y="552" class="tiny">HTTPS · JWT bearer token</text>
  <rect x="92" y="564" width="109" height="22" rx="11" fill="#EAF8F7"/>
  <text x="106" y="579" class="pill" fill="#078A98">NEXT.JS CLIENTS</text>

  <!-- Compose boundary -->
  <text x="308" y="392" class="zone">PRIVATE APPLICATION NETWORK</text>
  <g filter="url(#shadowSmall)">
    <rect x="286" y="410" width="574" height="505" rx="24" fill="#FFF" stroke="#9CB2C8" stroke-width="2" stroke-dasharray="8 8"/>
  </g>
  <rect x="308" y="430" width="236" height="30" rx="15" fill="#EEF4F9"/>
  <text x="326" y="450" class="pill" fill="#4D657E">DOCKER COMPOSE · INTERNAL</text>

  <!-- API card -->
  <g filter="url(#shadowSmall)">
    <rect x="315" y="488" width="160" height="170" rx="18" fill="#F2F6FC" stroke="#B9CAE0"/>
  </g>
  <circle cx="345" cy="522" r="19" fill="#E54A4A"/>
  <path d="M336 512l18 20M354 512l-18 20" stroke="#FFF" stroke-width="3.5" stroke-linecap="round"/>
  <text x="375" y="520" class="card-title">NestJS API</text>
  <text x="375" y="540" class="card-copy">HTTP control plane</text>
  <line x1="335" y1="564" x2="455" y2="564" stroke="#D7E2EF"/>
  <text x="335" y="588" class="tiny">Auth + membership</text>
  <text x="335" y="609" class="tiny">Tenant context + writes</text>
  <text x="335" y="630" class="tiny">Public API · /api/v1</text>

  <!-- Worker card -->
  <g filter="url(#shadowSmall)">
    <rect x="500" y="488" width="160" height="170" rx="18" fill="#F6F2FF" stroke="#CBBEF0"/>
  </g>
  <circle cx="530" cy="522" r="19" fill="url(#purple)"/>
  <path d="M520 522h20M530 512v20M523 515l14 14M537 515l-14 14" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
  <text x="560" y="520" class="card-title">AI worker</text>
  <text x="560" y="540" class="card-copy">NestJS process</text>
  <line x1="520" y1="564" x2="640" y2="564" stroke="#E2DAF8"/>
  <text x="520" y="588" class="tiny">Consumes durable work</text>
  <text x="520" y="609" class="tiny">Retries + reconciliation</text>
  <text x="520" y="630" class="tiny">No public HTTP surface</text>

  <!-- FastAPI card -->
  <g filter="url(#shadowSmall)">
    <rect x="685" y="488" width="150" height="170" rx="18" fill="#EAF9F7" stroke="#AEE3DE"/>
  </g>
  <circle cx="715" cy="522" r="19" fill="url(#teal)"/>
  <path d="M706 531l9-18 4 11 7-2-9 10z" fill="#FFF"/>
  <text x="745" y="520" class="card-title">FastAPI AI</text>
  <text x="745" y="540" class="card-copy">Inference only</text>
  <line x1="705" y1="564" x2="815" y2="564" stroke="#CDEEEB"/>
  <text x="705" y="588" class="tiny">Parse · embed · classify</text>
  <text x="705" y="609" class="tiny">Generate content</text>
  <text x="705" y="630" class="tiny">X-Service-Secret</text>

  <!-- State -->
  <text x="315" y="708" class="zone">STATEFUL SERVICES</text>
  <g filter="url(#shadowSmall)">
    <rect x="315" y="726" width="156" height="152" rx="18" fill="#F2F8FF" stroke="#BAD7F2"/>
    <rect x="495" y="726" width="156" height="152" rx="18" fill="#FFF5F3" stroke="#F4CAC2"/>
    <rect x="675" y="726" width="160" height="152" rx="18" fill="#F5F9F7" stroke="#C4E2D3"/>
  </g>
  <!-- PostgreSQL logo-style -->
  <ellipse cx="345" cy="756" rx="17" ry="8" fill="#376996"/>
  <path d="M328 756v23c0 5 34 5 34 0v-23" fill="#4C83B1"/>
  <ellipse cx="345" cy="779" rx="17" ry="8" fill="#376996"/>
  <text x="374" y="757" class="card-title">PostgreSQL</text>
  <text x="374" y="777" class="card-copy">+ pgvector</text>
  <text x="335" y="818" class="tiny">Business truth</text>
  <text x="335" y="839" class="tiny">AI snapshots · vectors</text>
  <!-- Redis logo-style -->
  <path d="M514 749l18-9 18 9-18 9zM514 760l18 9 18-9M514 771l18 9 18-9" fill="none" stroke="#DC4C4C" stroke-width="5" stroke-linejoin="round"/>
  <text x="555" y="757" class="card-title">Redis</text>
  <text x="555" y="777" class="card-copy">BullMQ + cache</text>
  <text x="515" y="818" class="tiny">Queue · locks · cache</text>
  <text x="515" y="839" class="tiny">Worker heartbeat</text>
  <!-- Storage logo-style -->
  <path d="M693 747l18-10 18 10-18 10zM693 747v21l18 10 18-10v-21" fill="#5AA58E" stroke="#26735E" stroke-width="2"/>
  <path d="M711 757v21" stroke="#E9FFF7" stroke-width="2"/>
  <text x="745" y="757" class="card-title">File storage</text>
  <text x="745" y="777" class="card-copy">Local / Azure Blob</text>
  <text x="695" y="818" class="tiny">R&#233;sum&#233;s · uploads</text>
  <text x="695" y="839" class="tiny">Validated lifecycle</text>

  <!-- Provider -->
  <text x="690" y="250" class="zone">MODEL PROVIDERS</text>
  <g filter="url(#shadowSmall)">
    <rect x="682" y="270" width="180" height="124" rx="18" fill="#FFFAF0" stroke="#F0D5A0"/>
  </g>
  <path d="M714 299l6 13 13 6-13 6-6 13-6-13-13-6 13-6z" fill="#7A67F8"/>
  <text x="742" y="308" class="card-title">Gemini / Azure</text>
  <text x="742" y="328" class="card-copy">Selected by AI_PROVIDER</text>
  <rect x="704" y="350" width="135" height="22" rx="11" fill="#FFF0D6"/>
  <text x="720" y="365" class="pill" fill="#9A6300">OPTIONAL VISION OCR</text>

  <!-- Physical connectors -->
  <path d="M265 502H315" class="connector" stroke="#173D68" stroke-width="3" marker-end="url(#arrowNavy)"/>
  <text x="272" y="488" class="micro">HTTPS</text>
  <path d="M475 550H500" class="connector" stroke="#7355D5" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrowPurple)"/>
  <path d="M660 550H685" class="connector" stroke="#0BAAA9" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <path d="M395 658v60" class="connector" stroke="#173D68" stroke-width="2.5" marker-end="url(#arrowNavy)"/>
  <path d="M550 658v60" class="connector" stroke="#7355D5" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <path d="M760 658v60" class="connector" stroke="#0BAAA9" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <path d="M760 488V394" class="connector" stroke="#0BAAA9" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <text x="775" y="440" class="micro">LLM API</text>
  <text x="355" y="690" class="micro" fill="#315D8D">PERSIST</text>
  <text x="530" y="690" class="micro" fill="#6650B9">QUEUE</text>
  <text x="720" y="690" class="micro" fill="#078A98">READ / WRITE</text>

  <!-- RIGHT: Logical architecture -->
  <text x="1015" y="280" class="panel-subtitle">02 / EXECUTION FLOW</text>
  <text x="1015" y="315" class="panel-title">Logical architecture</text>
  <text x="1015" y="340" class="subtitle">The platform keeps final assessment rules deterministic and evidence-backed.</text>

  <!-- Logical lanes -->
  <rect x="1015" y="375" width="820" height="136" rx="20" fill="#FFFFFF" stroke="#D6E1ED"/>
  <text x="1040" y="406" class="zone">EXPERIENCE &amp; TRUST</text>
  <g filter="url(#shadowSmall)">
    <rect x="1040" y="426" width="148" height="64" rx="14" fill="#F3F7FC" stroke="#C5D3E2"/>
    <rect x="1210" y="426" width="238" height="64" rx="14" fill="#EAF8F7" stroke="#B9E7E2"/>
    <rect x="1470" y="426" width="340" height="64" rx="14" fill="#F2F6FC" stroke="#B9CAE0"/>
  </g>
  <circle cx="1067" cy="458" r="15" fill="#173D68"/>
  <path d="M1060 464c2-9 12-9 14 0M1062 452a5 5 0 1 0 10 0a5 5 0 0 0-10 0" fill="none" stroke="#FFF" stroke-width="2"/>
  <text x="1092" y="455" class="card-title">People</text>
  <text x="1092" y="474" class="card-copy">Candidates &amp; recruiters</text>
  <circle cx="1237" cy="458" r="15" fill="#0BAAA9"/>
  <path d="M1229 457h16M1237 449v16" stroke="#FFF" stroke-width="2.3" stroke-linecap="round"/>
  <text x="1262" y="455" class="card-title">PEAXIS applications</text>
  <text x="1262" y="474" class="card-copy">Jobs · Hire · Core · Admin</text>
  <circle cx="1497" cy="458" r="15" fill="#173D68"/>
  <path d="M1490 458l5 5 10-11" fill="none" stroke="#FFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1522" y="455" class="card-title">NestJS platform control plane</text>
  <text x="1522" y="474" class="card-copy">JWT · membership · tenant scope · writes</text>

  <!-- Flow blocks -->
  <text x="1038" y="556" class="zone">BUSINESS &amp; EVIDENCE</text>
  <g filter="url(#shadowSmall)">
    <rect x="1015" y="575" width="250" height="190" rx="20" fill="#F3F7FC" stroke="#C5D3E2"/>
    <rect x="1300" y="575" width="250" height="190" rx="20" fill="#F6F2FF" stroke="#D2C8F3"/>
    <rect x="1585" y="575" width="250" height="190" rx="20" fill="#EAF9F7" stroke="#B9E7E2"/>
  </g>
  <!-- Domain card -->
  <rect x="1038" y="598" width="49" height="49" rx="15" fill="url(#navy)"/>
  <path d="M1051 613h24v19h-24zM1055 609h16" fill="none" stroke="#FFF" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="1103" y="618" class="card-title">Domain records</text>
  <text x="1103" y="638" class="card-copy">Jobs, CVs, applications</text>
  <line x1="1038" y1="667" x2="1240" y2="667" stroke="#D7E2EF"/>
  <text x="1038" y="694" class="tiny">• Confirmed requirements</text>
  <text x="1038" y="718" class="tiny">• Candidate evidence claims</text>
  <text x="1038" y="742" class="tiny">• Application lifecycle events</text>
  <!-- Work card -->
  <rect x="1323" y="598" width="49" height="49" rx="15" fill="url(#purple)"/>
  <path d="M1336 612h23v21h-23zM1341 608h13M1341 620h13M1341 626h9" fill="none" stroke="#FFF" stroke-width="2.1" stroke-linecap="round"/>
  <text x="1388" y="618" class="card-title">Durable AI work</text>
  <text x="1388" y="638" class="card-copy">AiWorkItem + BullMQ</text>
  <line x1="1323" y1="667" x2="1525" y2="667" stroke="#E2DAF8"/>
  <text x="1323" y="694" class="tiny">• Parse CV / build chunks</text>
  <text x="1323" y="718" class="tiny">• Index jobs / score evidence</text>
  <text x="1323" y="742" class="tiny">• Generate supported content</text>
  <!-- AI card -->
  <rect x="1608" y="598" width="49" height="49" rx="15" fill="url(#teal)"/>
  <path d="M1618 631l10-22 5 13 10-4-14 14z" fill="#FFF"/>
  <text x="1673" y="618" class="card-title">FastAPI inference</text>
  <text x="1673" y="638" class="card-copy">Provider-selected LLM</text>
  <line x1="1608" y1="667" x2="1810" y2="667" stroke="#CDEEEB"/>
  <text x="1608" y="694" class="tiny">• Parse / structure / embed</text>
  <text x="1608" y="718" class="tiny">• Classify supplied citations</text>
  <text x="1608" y="742" class="tiny">• Draft approved content types</text>

  <!-- Assessment and store -->
  <g filter="url(#shadowSmall)">
    <rect x="1015" y="808" width="360" height="148" rx="20" fill="#FFF9EE" stroke="#F0D7A3"/>
    <rect x="1410" y="808" width="425" height="148" rx="20" fill="#F2F8FF" stroke="#BAD7F2"/>
  </g>
  <rect x="1038" y="831" width="46" height="46" rx="14" fill="#D89416"/>
  <path d="M1049 851h24M1061 839v24M1053 843l16 16M1069 843l-16 16" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
  <text x="1100" y="850" class="card-title">Evidence assessment engine</text>
  <text x="1100" y="871" class="card-copy">NestJS deterministic rules, not an LLM ranking decision.</text>
  <text x="1038" y="909" class="tiny">Satisfaction · verification · weighted requirement alignment</text>
  <text x="1038" y="929" class="tiny">Explainable scores with cited evidence</text>
  <rect x="1434" y="831" width="46" height="46" rx="14" fill="#3E79A9"/>
  <ellipse cx="1457" cy="845" rx="11" ry="5" fill="#FFF"/>
  <path d="M1446 845v16c0 5 22 5 22 0v-16" fill="#76A6CE"/>
  <text x="1496" y="850" class="card-title">Authoritative data &amp; retrieval</text>
  <text x="1496" y="871" class="card-copy">PostgreSQL snapshots · pgvector chunks · Redis cache / queues</text>
  <text x="1434" y="909" class="tiny">Assessment snapshots · requirement evaluation · evidence citations</text>
  <text x="1434" y="929" class="tiny">Generated content · operations · usage records</text>

  <!-- Logical connectors -->
  <path d="M1188 458H1210" class="connector" stroke="#0BAAA9" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <path d="M1448 458H1470" class="connector" stroke="#173D68" stroke-width="3" marker-end="url(#arrowNavy)"/>
  <path d="M1600 510v35h-460v30" class="connector" stroke="#173D68" stroke-width="3" marker-end="url(#arrowNavy)"/>
  <path d="M1265 670H1300" class="connector" stroke="#7355D5" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <path d="M1550 670H1585" class="connector" stroke="#0BAAA9" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <path d="M1140 765v43" class="connector" stroke="#D89416" stroke-width="3" marker-end="url(#arrowNavy)"/>
  <path d="M1710 765v43" class="connector" stroke="#0BAAA9" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <path d="M1375 882h35" class="connector" stroke="#173D68" stroke-width="3" marker-end="url(#arrowNavy)"/>
  <text x="1277" y="653" class="micro" fill="#6650B9">ASYNC</text>
  <text x="1556" y="653" class="micro" fill="#078A98">INFERENCE</text>
  <text x="1088" y="792" class="micro" fill="#9A6300">RULES + CITATIONS</text>
  <text x="1670" y="792" class="micro" fill="#078A98">PERSIST / RETRIEVE</text>

  <!-- Footer legend -->
  <line x1="70" y1="1000" x2="1850" y2="1000" stroke="#D7E2EF"/>
  <circle cx="84" cy="1031" r="6" fill="#173D68"/>
  <text x="99" y="1036" class="tiny">Platform &amp; trusted control</text>
  <circle cx="322" cy="1031" r="6" fill="#7355D5"/>
  <text x="337" y="1036" class="tiny">Durable asynchronous work</text>
  <circle cx="584" cy="1031" r="6" fill="#0BAAA9"/>
  <text x="599" y="1036" class="tiny">Inference &amp; model integration</text>
  <circle cx="886" cy="1031" r="6" fill="#D89416"/>
  <text x="901" y="1036" class="tiny">Deterministic evidence scoring</text>
  <text x="1850" y="1036" text-anchor="end" class="tiny">PEAXIS · architecture overview</text>
</svg>
